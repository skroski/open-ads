<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Open Ads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script>
    /* Mesmo script e mesma chave do painel Angular: a escolha de tema vale nas duas versões.
       "Sistema" = sem data-theme: o daisyUI segue prefers-color-scheme. */
    (function () {
      try {
        var t = localStorage.getItem('gads_theme_pref');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* armazenamento indisponível */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
